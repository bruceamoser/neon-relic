name: Release Starter Kit
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pandoc/actions/setup@v1
        with:
          version: '3.7.0.2'
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: '0.15.1'
      - name: Build book and starter kit
        run: ./scripts/build.sh
      - name: Audit release
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python3 scripts/audit_book.py
      - name: Prepare stable download name
        run: cp dist/neon-relic-core-rules.pdf dist/neon-relic.pdf
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/neon-relic.pdf
            dist/starter-kit.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
